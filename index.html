<style>
:root {
  /* Caffè del Barrio: nero e bianco come il logo. Home a schede di categoria, vista categoria a card; pillole sempre in alto. */
  --ink: #000000;
  --bar: #0c0c0c;
  --card: #141414;
  --line: #333333;
  --paper: #ffffff;
  --muted: #a8a8a8;
  --display: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

/* Barra in alto */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--bar); border-bottom: 1px solid #1d1d1d; }
.topbar-inner { max-width: 640px; margin: 0 auto; height: 78px; display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; padding: 0 12px; }
.back { display: flex; visibility: hidden; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; cursor: pointer; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px; border-radius: 10px; }
.back svg { width: 24px; height: 24px; stroke: var(--paper); }
body.in-cat .back { visibility: visible; }
.brand { justify-self: center; display: block; line-height: 0; background: none; border: 0; padding: 0; cursor: pointer; }
.brand img { height: 64px; width: auto; }

/* Pillole categorie */
.pills { position: sticky; top: 78px; z-index: 9; background: var(--ink); }
.pills-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; overflow-x: auto; padding: 14px 16px; scrollbar-width: none; }
.pills-inner::-webkit-scrollbar { display: none; }
.pill { flex: none; border: 2px solid var(--line); background: #1a1a1a; border-radius: 999px; padding: 10px 20px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; line-height: 1.2; padding-top: 12px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
.pill[aria-current="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }

main { max-width: 640px; margin: 0 auto; padding: 4px 16px 48px; }

/* Home */
.hero { position: relative; max-width: 640px; margin: 0 auto; height: 220px; display: grid; place-items: center; text-align: center; overflow: hidden; background-color: #050505; background-image: var(--pattern); background-size: 260px auto; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.35) 0%, rgba(0,0,0,.85) 70%); }
.hero-text { position: relative; z-index: 1; padding: 0 20px; display: grid; gap: 8px; }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(30px, 8.5vw, 44px); letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
.hero-cat { height: 150px; }
.hero.hero-cat h1 { font-weight: 700; font-size: clamp(26px, 7.5vw, 36px); }
.hero.hero-cat p { letter-spacing: .02em; text-transform: none; font-family: var(--body); font-size: 14px; color: #cfcfcf; }
.hero p { margin: 0; font-family: var(--display); font-weight: 300; font-size: 15px; letter-spacing: .35em; text-transform: lowercase; color: #dcdcdc; }

.cats { display: grid; gap: 22px; padding-top: 6px; }
.cat { display: block; width: 100%; text-align: center; padding: 0; border: 0; background: var(--card); border-radius: 18px; overflow: hidden; cursor: pointer; }
.cat-art { position: relative; height: 128px; background-color: #000; background-image: var(--pattern); background-size: 260px auto; display: grid; place-items: center; }
.cat-art .badge { width: 74px; height: 74px; border-radius: 50%; background: #000; border: 1px solid #3a3a3a; display: grid; place-items: center; }
.cat-art .badge svg { width: 44px; height: 44px; stroke: var(--paper); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.cat-body { padding: 22px 18px 26px; display: grid; gap: 6px; }
.cat-title { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-wrap: balance; }
.cat-title svg { width: 18px; height: 18px; stroke: var(--paper); flex: none; transform: translateY(-2px); }
.cat-sub { color: var(--muted); font-size: 15px; }
.cat-count { font-size: 12px; color: #777; letter-spacing: .08em; text-transform: uppercase; }

/* Categoria */
.cat-head { padding: 10px 2px 16px; display: grid; gap: 2px; }
.cat-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.cat-head p { margin: 0; color: var(--muted); }
.items { display: grid; gap: 14px; padding-top: 6px; }
.item { background: var(--card); border-radius: 18px; padding: 20px 20px 22px; display: grid; gap: 8px; }
.item.has-img { grid-template-columns: 92px 1fr; gap: 16px; align-items: start; padding: 16px; }
.item.has-img .thumb { width: 92px; height: 123px; object-fit: cover; border-radius: 12px; background: #000; }
.item.has-img .thumb.logo { object-fit: contain; background: transparent; height: 100px; border-radius: 0; }
.item-body { display: grid; gap: 8px; min-width: 0; }
.item.compact { padding: 16px 20px; }
.item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.item h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: .03em; text-transform: uppercase; line-height: 1.15; padding-top: 4px; }
.price { font-family: var(--display); font-weight: 700; font-size: 22px; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1; padding-top: 4px; }
.price sup { font-size: .55em; vertical-align: top; position: relative; top: -.1em; margin-left: 1px; }
.meta { font-size: 14px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.desc { margin: 0; color: #d6d6d6; font-size: 15.5px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid #555; color: #ddd; letter-spacing: .04em; }
.sizes { display: grid; gap: 0; margin-top: 4px; }
.size { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px solid #262626; }
.size span:first-child { color: #d6d6d6; font-size: 16px; }
.size .price { font-size: 20px; }

.foot { margin: 16px 4px 0; color: var(--muted); font-size: 14px; text-align: center; }
.info { margin-top: 22px; background: var(--card); border-radius: 18px; padding: 24px 22px; text-align: center; display: grid; gap: 8px; }
.info h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .03em; }
.info p { margin: 0; color: #cfcfcf; }
.sec-hero { height: 132px; border-radius: 18px; margin: 22px 0 14px; }
.sec:first-child .sec-hero { margin-top: 6px; }
.sec-hero h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(24px, 7vw, 32px); letter-spacing: .05em; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
.hero.sec-hero p { letter-spacing: .02em; text-transform: none; font-family: var(--body); font-weight: 400; font-size: 14px; color: #cfcfcf; }
footer { max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; text-align: center; color: #777; font-size: 12.5px; }
.view[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .cat { transition: transform .15s ease; } .cat:active { transform: scale(.985); } }
</style>
</head>

  gintonic: '<path d="M18 10h28c3 10 2 22-14 26C16 32 15 20 18 10z"/><path d="M32 36v16M22 56h20"/><circle cx="27" cy="22" r="2"/><circle cx="36" cy="26" r="1.6"/><circle cx="33" cy="17" r="1.4"/><path d="M40 4l-6 14"/>',
  distillati: '<path d="M16 22h32l-3 32H19z"/><rect x="23" y="34" width="9" height="9" rx="1.5" transform="rotate(-12 27 38)"/><rect x="33" y="38" width="8" height="8" rx="1.5" transform="rotate(10 37 42)"/><path d="M18 30h28"/>',
  amari: '<path d="M27 6h10v8c0 3 6 6 6 12v28a3 3 0 0 1-3 3H24a3 3 0 0 1-3-3V26c0-6 6-9 6-12z"/><path d="M21 32h22v14H21z"/><path d="M27 10h10"/>',
  spina: '<path d="M16 18h26v34a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4z"/><path d="M42 24h5a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-5"/><path d="M14 18c0-5 4-8 8-8 2-4 9-5 12-1 5-1 10 3 9 9"/><path d="M23 28v20M29 28v20M35 28v20"/>',
  bottiglia: '<path d="M28 4h8v12c0 4 7 7 7 14v24a4 4 0 0 1-4 4H25a4 4 0 0 1-4-4V30c0-7 7-10 7-14z"/><path d="M21 34h22v12H21z"/><path d="M28 8h8"/>',
  pizzerosse: '<path d="M32 8 8 52c15 7 33 7 48 0z"/><path d="M12 45c13 5 27 5 40 0"/><circle cx="30" cy="26" r="3.5"/><circle cx="24" cy="38" r="3.5"/><circle cx="38" cy="37" r="3.5"/>',
  pizzebianche: '<circle cx="32" cy="32" r="24"/><circle cx="32" cy="32" r="18"/><path d="M32 14v36M14 32h36M19 19l26 26M45 19 19 45"/>',
  pinsa: '<ellipse cx="32" cy="32" rx="26" ry="17"/><ellipse cx="32" cy="32" rx="20" ry="11.5"/><circle cx="24" cy="30" r="2.5"/><circle cx="36" cy="35" r="2.5"/><circle cx="40" cy="27" r="2.5"/>',
  vini: '<path d="M14 8h14c0 12-2 20-7 20S14 20 14 8z"/><path d="M21 28v18M15 50h12"/><path d="M15 15h12"/><path d="M40 6h6v8c0 3 5 5 5 10v30a3 3 0 0 1-3 3h-10a3 3 0 0 1-3-3V24c0-5 5-7 5-10z"/><path d="M35 30h16v12H35z"/>',
  bibite: '<path d="M20 12h24v42a3 3 0 0 1-3 3H23a3 3 0 0 1-3-3z"/><path d="M22 8h20l2 4H20z"/><path d="M28 6c0-2 2-3 4-3"/><path d="M20 24h24M20 44h24"/>',
};
ICONS.vinirossi = ICONS.vini;
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

// Motivo di sfondo con icone da bar a linee sottili
const PATTERN = `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="180" viewBox="0 0 260 180" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<g transform="translate(14 14) scale(.8)">${ICONS.cocktail}</g>
<g transform="translate(96 6) scale(.7)">${ICONS.spina}</g>
<g transform="translate(176 20) scale(.75)">${ICONS.amari}</g>
<g transform="translate(40 96) scale(.75)">${ICONS.gintonic}</g>
<g transform="translate(130 92) scale(.8)">${ICONS.distillati}</g>
<g transform="translate(206 104) scale(.65)">${ICONS.bibite}</g>
<circle cx="80" cy="80" r="5"/><path d="M80 72v16M72 80h16" stroke-opacity=".18"/>
<circle cx="170" cy="78" r="12"/><path d="M170 66v24M158 78h24M161.5 69.5l17 17M178.5 69.5l-17 17" stroke-opacity=".2"/>
<path d="M118 158l3 3 3-3-3-3zM240 70l3 3 3-3-3-3zM16 76l2 2 2-2-2-2zM248 160h6M251 157v6M110 66h5M112.5 63.5v5"/>
</svg>`;
document.documentElement.style.setProperty("--pattern", `url("data:image/svg+xml,${encodeURIComponent(PATTERN)}")`);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const price = p => { const [e, c] = p.toFixed(2).split("."); return `€ ${e}<sup>,${c}</sup>`; };
const TAG = { zero: "analcolico", forte: "forte" };

const pillsEl = document.getElementById("pills");
pillsEl.innerHTML = `<button class="pill" type="button" data-home="1">Menu</button>` + MENU.map(s => `<button class="pill" type="button" data-id="${s.id}">${esc(s.title)}</button>`).join("");
document.getElementById("cats").innerHTML = MENU.map(s => `
  <button class="cat" type="button" data-id="${s.id}">
    <div class="cat-art" aria-hidden="true"><div class="badge"><svg viewBox="0 0 64 64">${ICONS[s.id] || ICONS.cocktail}</svg></div></div>
    <div class="cat-body">
      <span class="cat-title">${esc(s.title)} ${CHEVRON}</span>
      ${s.sub ? `<span class="cat-sub">${esc(s.sub)}</span>` : ""}
      <span class="cat-count">${s.items.length} ${s.items.length === 1 ? "voce" : "voci"}</span>
    </div>
  </button>`).join("");

function itemHTML(it) {
  const meta = it.g ? `<div class="meta">${esc(it.g)}</div>` : "";
  const desc = it.i ? `<p class="desc">${esc(it.i)}</p>` : "";
  const sizes = it.sizes ? `<div class="sizes">${it.sizes.map(([l, p]) => `<div class="size"><span>${esc(l)}</span><span class="price">${price(p)}</span></div>`).join("")}</div>` : "";
  const tags = (it.t || []).length ? `<div class="tags">${it.t.map(t => `<span class="tag">${TAG[t] || t}</span>`).join("")}</div>` : "";
  const compact = !meta && !desc && !sizes && !tags;
  const body = `<div class="item-top"><h3>${esc(it.n)}</h3>${it.p != null ? `<span class="price">${price(it.p)}</span>` : ""}</div>
    ${meta}${desc}${sizes}${tags}`;
  if (it.img) return `<article class="item has-img"><img class="thumb${it.logo ? " logo" : ""}" src="${it.img}" alt="${it.logo ? "Logo" : "Bottiglia"} di ${esc(it.n)}" width="360" height="480" loading="lazy"><div class="item-body">${body}</div></article>`;
  return `<article class="item${compact ? " compact" : ""}">${body}</article>`;
}

const sectionsEl = document.getElementById("sections");
sectionsEl.innerHTML = MENU.map(sec => `
  <section class="sec" id="sec-${sec.id}" data-sec="${sec.id}">
    <div class="hero hero-cat sec-hero"><div class="hero-text"><h2>${esc(sec.title)}</h2>${sec.sub ? `<p>${esc(sec.sub)}</p>` : ""}</div></div>
    <div class="items">${sec.items.map(itemHTML).join("")}</div>
    ${sec.foot ? `<p class="foot">* ${esc(sec.foot)}</p>` : ""}
  </section>`).join("");
const pillsBox = document.querySelector(".pills");
const stickBottom = () => pillsBox.getBoundingClientRect().bottom;
let activeId = null;
function setActive(id) {
  activeId = id;
  pillsEl.querySelectorAll(".pill").forEach(b => b.setAttribute("aria-current", String(id ? b.dataset.id === id : !!b.dataset.home)));
  const pill = id ? pillsEl.querySelector(`[data-id="${id}"]`) : null;
  const max = pillsEl.scrollWidth - pillsEl.clientWidth;
  const offset = pill ? pill.getBoundingClientRect().left - pillsEl.getBoundingClientRect().left + pillsEl.scrollLeft : 0;
  const target = pill ? Math.max(0, Math.min(max, offset - (pillsEl.clientWidth - pill.offsetWidth) / 2)) : 0;
  slidePills(target);
}
// Animazione manuale: i browser dei telefoni interrompono lo scorrimento "smooth" mentre la pagina scorre
let slideRaf = null;
function slidePills(target) {
  cancelAnimationFrame(slideRaf);
  const start = pillsEl.scrollLeft, dist = target - start, t0 = performance.now(), dur = 260;
  if (Math.abs(dist) < 1) return;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    pillsEl.scrollLeft = start + dist * e;
    if (k < 1) slideRaf = requestAnimationFrame(step);
  };
  slideRaf = requestAnimationFrame(step);
}
function show() {
  const id = location.hash.slice(1);
  const sec = MENU.find(s => s.id === id);
  document.body.classList.toggle("in-cat", !!sec);
  document.getElementById("home").hidden = !!sec;
  document.getElementById("home-hero").hidden = !!sec;
  document.getElementById("category").hidden = !sec;
  if (!sec) { setActive(null); window.scrollTo(0, 0); return; }
  setActive(sec.id);
  const el = document.getElementById("sec-" + sec.id);
  window.scrollTo(0, sec === MENU[0] ? 0 : el.getBoundingClientRect().top + window.scrollY - stickBottom() + 1);
}
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking || !document.body.classList.contains("in-cat")) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const line = stickBottom() + 24;
    let cur = MENU[0].id;
    for (const el of sectionsEl.children) { if (el.getBoundingClientRect().top <= line) cur = el.dataset.sec; else break; }
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = MENU[MENU.length - 1].id;
    if (cur !== activeId) { setActive(cur); history.replaceState(null, "", "#" + cur); }
  });
}, { passive: true });
const go = id => { if (location.hash.slice(1) === id) show(); else location.hash = id; };
document.addEventListener("click", e => {
  if (e.target.closest("[data-home]")) { goHome(); return; }
  const t = e.target.closest("[data-id]"); if (t) go(t.dataset.id);
});
function goHome() { if (location.hash) history.pushState(null, "", location.pathname); show(); }
document.getElementById("back").addEventListener("click", goHome);
document.getElementById("brand").addEventListener("click", goHome);
window.addEventListener("popstate", show);
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
